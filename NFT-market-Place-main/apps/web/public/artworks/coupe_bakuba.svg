<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBakuba" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="65%" stop-color="#140F0D"/>
      <stop offset="100%" stop-color="#080605"/>
    </radialGradient>
    <linearGradient id="ebonyWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3B32"/>
      <stop offset="40%" stop-color="#2D211B"/>
      <stop offset="80%" stop-color="#1A130F"/>
      <stop offset="100%" stop-color="#0F0B09"/>
    </linearGradient>
    <linearGradient id="patinaLuster" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#C86D3B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#E9C46A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgBakuba)"/>

  <!-- Pedestal & Shadow -->
  <ellipse cx="400" cy="515" rx="220" ry="32" fill="#000000" opacity="0.8" filter="blur(10px)"/>

  <!-- Cephalomorphic Bakuba Royal Cup -->
  <g filter="url(#cupShadow)">
    <!-- Flared Circular Foot Base -->
    <path d="M 310 490 C 310 450 350 440 370 420 L 430 420 C 450 440 490 450 490 490 Z" 
          fill="url(#ebonyWood)" stroke="#140F0D" stroke-width="3"/>
    <ellipse cx="400" cy="488" rx="88" ry="18" fill="#1C140F" stroke="#C86D3B" stroke-width="1.5" opacity="0.8"/>
    <!-- Interlocking geometric scarifications on base -->
    <path d="M 330 475 L 350 455 L 370 475 L 390 455 L 410 475 L 430 455 L 450 475 L 470 455" 
          fill="none" stroke="#C86D3B" stroke-width="3.5" opacity="0.7"/>

    <!-- Neck Pillar -->
    <rect x="375" y="370" width="50" height="55" rx="6" fill="url(#ebonyWood)" stroke="#140F0D" stroke-width="2"/>
    <ellipse cx="400" cy="370" rx="26" ry="7" fill="#C86D3B" opacity="0.6"/>

    <!-- Head / Cup Vessel (Carved stylized noble head) -->
    <!-- Chin & Jawline -->
    <path d="M 320 230 C 310 320 350 370 400 370 C 450 370 490 320 480 230 Z" 
          fill="url(#ebonyWood)" stroke="#140F0D" stroke-width="3"/>
    <path d="M 320 230 C 310 320 350 370 400 370 C 450 370 490 320 480 230 Z" 
          fill="url(#patinaLuster)"/>

    <!-- Facial Scarifications (Bapele / Imbalembale traditional royal patterns) -->
    <!-- Cheeks scarifications -->
    <path d="M 345 285 L 365 295 L 345 305" fill="none" stroke="#C86D3B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 455 285 L 435 295 L 455 305" fill="none" stroke="#C86D3B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose (Long, stylized, refined African bridge) -->
    <path d="M 395 240 L 395 295 L 385 305 L 415 305 L 405 295 L 405 240 Z" fill="#241B16" stroke="#0F0B09" stroke-width="1.5"/>

    <!-- Coffee-bean shaped eyes with downcast royal gaze -->
    <ellipse cx="360" cy="250" rx="18" ry="10" transform="rotate(-5 360 250)" fill="#1A120E" stroke="#4A3B32" stroke-width="2"/>
    <path d="M 342 250 L 378 250" stroke="#0A0705" stroke-width="2.5"/>

    <ellipse cx="440" cy="250" rx="18" ry="10" transform="rotate(5 440 250)" fill="#1A120E" stroke="#4A3B32" stroke-width="2"/>
    <path d="M 422 250 L 458 250" stroke="#0A0705" stroke-width="2.5"/>

    <!-- Subtle serene lips -->
    <path d="M 385 330 Q 400 338 415 330" fill="none" stroke="#3D2D23" stroke-width="4" stroke-linecap="round"/>

    <!-- Cup Rim / Flared Royal Coiffure (Opening of drinking vessel) -->
    <path d="M 300 150 C 295 190 315 235 320 235 L 480 235 C 485 235 505 190 500 150 Z" 
          fill="url(#ebonyWood)" stroke="#140F0D" stroke-width="3"/>
    
    <!-- Top Vessel Hollow Opening -->
    <ellipse cx="400" cy="150" rx="100" ry="24" fill="#140F0D" stroke="#C86D3B" stroke-width="3"/>
    <ellipse cx="400" cy="150" rx="88" ry="18" fill="#0A0705"/>

    <!-- Royal Coiffure Geometrics around the rim -->
    <path d="M 310 175 L 330 155 L 350 175 L 370 155 L 390 175 L 410 155 L 430 175 L 450 155 L 470 175 L 490 155" 
          fill="none" stroke="#E9C46A" stroke-width="3.5" opacity="0.85"/>

    <!-- Sculpted Ergonomic Loop Handle on the back -->
    <path d="M 475 200 C 530 200 540 310 460 330" fill="none" stroke="url(#ebonyWood)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 475 200 C 530 200 540 310 460 330" fill="none" stroke="#C86D3B" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Highlight Sheen -->
  <ellipse cx="370" cy="275" rx="14" ry="40" transform="rotate(-15 370 275)" fill="#FFFFFF" opacity="0.08" filter="blur(4px)"/>

  <!-- Label Badge -->
  <g transform="translate(40, 520)">
    <rect width="260" height="50" rx="12" fill="#1B4332" opacity="0.9" stroke="#E9C46A" stroke-width="1.5"/>
    <text x="20" y="24" font-family="serif" font-size="14" font-weight="bold" fill="#E9C46A">COUPE ROYALE BAKUBA</text>
    <text x="20" y="40" font-family="sans-serif" font-size="11" fill="#C1DBCF">Bois d'ébène & patine • Sankuru</text>
  </g>
</svg>
