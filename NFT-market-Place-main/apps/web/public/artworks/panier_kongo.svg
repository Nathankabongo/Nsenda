<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKongo" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D231E"/>
      <stop offset="70%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#0A0807"/>
    </radialGradient>
    <linearGradient id="rattanLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C39E"/>
      <stop offset="50%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#BC8A5F"/>
    </linearGradient>
    <linearGradient id="rattanDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A3427"/>
      <stop offset="50%" stop-color="#322218"/>
      <stop offset="100%" stop-color="#241710"/>
    </linearGradient>
    <filter id="basketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgKongo)"/>

  <!-- Shadow under basket -->
  <ellipse cx="400" cy="510" rx="240" ry="35" fill="#000000" opacity="0.75" filter="blur(10px)"/>

  <!-- Traditional Bakongo Coiled Basket Group -->
  <g filter="url(#basketShadow)">
    <!-- Base Basket Body Silhouette -->
    <path d="M 230 250 C 210 380 250 490 400 490 C 550 490 590 380 570 250 Z" 
          fill="#D4A373" stroke="#8C5835" stroke-width="3"/>

    <!-- Concentric Woven Coils & Geometry (Tiered horizontal coils) -->
    <!-- Coil 1 (Bottom) -->
    <ellipse cx="400" cy="460" rx="140" ry="25" fill="#BC8A5F" stroke="#322218" stroke-width="4"/>
    <!-- Coil 2 -->
    <ellipse cx="400" cy="430" rx="165" ry="28" fill="#D4A373" stroke="#322218" stroke-width="3.5"/>
    <path d="M 255 430 Q 400 470 545 430" fill="none" stroke="#241710" stroke-width="8" stroke-dasharray="14,14"/>

    <!-- Coil 3 (Geometric Chevron Band) -->
    <ellipse cx="400" cy="390" rx="185" ry="32" fill="#E8C39E" stroke="#322218" stroke-width="3.5"/>
    <!-- Black Diamond/Chevron Weave -->
    <path d="M 230 385 L 260 365 L 290 385 L 320 365 L 350 385 L 380 365 L 410 385 L 440 365 L 470 385 L 500 365 L 530 385 L 560 365" 
          fill="none" stroke="#241710" stroke-width="9" stroke-linejoin="round"/>
    
    <!-- Coil 4 -->
    <ellipse cx="400" cy="340" rx="195" ry="34" fill="#D4A373" stroke="#322218" stroke-width="3.5"/>
    <path d="M 215 340 Q 400 385 585 340" fill="none" stroke="#8C5835" stroke-width="6" stroke-dasharray="8,8"/>

    <!-- Coil 5 (Upper Diamond Motif Band) -->
    <ellipse cx="400" cy="290" rx="195" ry="35" fill="#E8C39E" stroke="#322218" stroke-width="3.5"/>
    <path d="M 215 285 L 250 265 L 285 285 L 320 265 L 355 285 L 390 265 L 425 285 L 460 265 L 495 285 L 530 265 L 565 285" 
          fill="none" stroke="#241710" stroke-width="9" stroke-linejoin="round"/>

    <!-- Rim / Opening of the Basket -->
    <ellipse cx="400" cy="245" rx="185" ry="32" fill="#241710"/>
    <ellipse cx="400" cy="245" rx="175" ry="28" fill="#181310"/>
    <ellipse cx="400" cy="245" rx="185" ry="32" fill="none" stroke="#E8C39E" stroke-width="6" stroke-dasharray="10,6"/>

    <!-- Conical Fitted Lid (Couvercle conique traditionnel) with Top Finial -->
    <path d="M 220 240 C 220 240 270 120 400 90 C 530 120 580 240 580 240 Z" 
          fill="url(#rattanLight)" stroke="#322218" stroke-width="4"/>
    
    <!-- Decorative bands on lid -->
    <path d="M 250 215 Q 400 245 550 215" fill="none" stroke="#241710" stroke-width="10" stroke-dasharray="16,12"/>
    <path d="M 290 175 Q 400 205 510 175" fill="none" stroke="#8C5835" stroke-width="8"/>
    <path d="M 330 140 Q 400 165 470 140" fill="none" stroke="#241710" stroke-width="10" stroke-dasharray="12,10"/>

    <!-- Woven Top Handle Knob -->
    <ellipse cx="400" cy="90" rx="20" ry="12" fill="#322218"/>
    <circle cx="400" cy="72" r="14" fill="#D4A373" stroke="#241710" stroke-width="3"/>
    <path d="M 400 58 L 400 72" stroke="#E8C39E" stroke-width="4"/>
  </g>

  <!-- Label Badge -->
  <g transform="translate(40, 520)">
    <rect width="270" height="50" rx="12" fill="#1B4332" opacity="0.9" stroke="#E9C46A" stroke-width="1.5"/>
    <text x="20" y="24" font-family="serif" font-size="14" font-weight="bold" fill="#E9C46A">VANNERIE DU KONGO CENTRAL</text>
    <text x="20" y="40" font-family="sans-serif" font-size="11" fill="#C1DBCF">Lianes & Bambou • Mbanza-Ngungu</text>
  </g>
</svg>
